name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src --ext .js,.jsx
      - run: npm run build

  backend:
    name: Backend + pipeline (compile + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/main.py backend/parser.py backend/services/*.py data_pipeline/*.py
      - name: Import check (routes register)
        run: |
          cd backend
          python -c "import main; assert any(getattr(r, 'path', '') == '/ask' for r in main.app.routes)"
